<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Licenças{% endblock %} · Painel de licenças</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
</head>
<body>
{% if g.user %}
<header class="top">
  <div class="brand">Painel de licenças</div>
  <nav>
    {% set ep = request.endpoint or '' %}
    <a href="{{ url_for('web.dashboard') }}" class="{{ 'on' if ep == 'web.dashboard' }}">Início</a>
    <a href="{{ url_for('web.customers') }}" class="{{ 'on' if 'customer' in ep }}">Clientes</a>
    <a href="{{ url_for('web.licenses') }}" class="{{ 'on' if 'license' in ep }}">Licenças</a>
    <a href="{{ url_for('brands.brands') }}" class="{{ 'on' if ep.startswith('brands.') }}">Marcas</a>
    <a href="{{ url_for('web.events') }}" class="{{ 'on' if ep == 'web.events' }}">Eventos</a>
    <a href="{{ url_for('web.settings') }}" class="{{ 'on' if ep == 'web.settings' }}">Configurações</a>
  </nav>
  <form method="post" action="{{ url_for('web.logout') }}" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="link">Sair ({{ g.user['username'] }})</button>
  </form>
</header>
{% endif %}
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
